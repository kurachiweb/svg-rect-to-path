name: svg-rect-to-path
services:
  frontend:
    env_file: .env
    build:
      dockerfile: ./Dockerfile
    tty: true
    ports:
      - ${PORT_FRONTEND_DEV}:5173 # for dev
      - ${PORT_FRONTEND_BUILD}:3000 # for build
    networks:
      - external
      - internal
    volumes:
      - type: bind
        source: ./
        target: /home/node
      - type: volume
        source: frontend-module
        target: /home/node/node_modules
      - type: volume
        source: frontend-output
        target: /home/node/.svelte-kit
networks:
  external:
    driver: bridge
    internal: false
  internal:
    driver: bridge
    internal: true
volumes:
  frontend-module:
  frontend-output:
